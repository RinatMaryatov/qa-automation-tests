name: QA Automation Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API and DB Tests
    runs-on: ubuntu-latest

    env:
      PROXY_ENABLED: "false"
      DB_USERS_USERNAME: ${{ secrets.DB_USERS_USERNAME }}
      DB_USERS_PASSWORD: ${{ secrets.DB_USERS_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JUnit tests
        run: bash ./gradlew clean test --no-daemon

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: bash ./gradlew allureReport --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-reports
          path: |
            build/reports/allure-report/allureReport/
            build/allure-results/
            build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
